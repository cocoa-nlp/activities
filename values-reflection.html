<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CoCoA Lab · 2026 Retreat — Reflect & Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F4EF;
    --card:#FBFCFA;
    --ink:#1B2A29;
    --pine:#2C5F5A;
    --pine-deep:#204643;
    --gold:#C8912F;
    --gold-soft:#F5EAD1;
    --slate:#647671;
    --line:#D6DDD5;
    --line-soft:#E4E9E2;
    --shadow:0 1px 2px rgba(27,42,41,.05),0 8px 24px rgba(27,42,41,.06);
    --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background-color:var(--paper);
    background-image:radial-gradient(var(--line-soft) 1px, transparent 1px);
    background-size:22px 22px;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    min-height:100vh;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:20px 18px calc(96px + env(safe-area-inset-bottom));
  }
  /* progress */
  .top{
    display:flex;align-items:center;gap:10px;
    padding:8px 2px 16px;
  }
  .dots{display:flex;gap:6px;flex:1}
  .dot{height:4px;flex:1;border-radius:99px;background:var(--line);transition:background .3s}
  .dot.on{background:var(--pine)}
  .dot.done{background:var(--gold)}
  .eyebrow{
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--slate);white-space:nowrap;
  }
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:22px 20px;box-shadow:var(--shadow);
  }
  h1{font-size:25px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
  h2{font-size:21px;line-height:1.25;margin:0 0 6px;letter-spacing:-.01em}
  .lede{color:var(--slate);font-size:15.5px;margin:0 0 4px}
  .step-label{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
  p.hint{color:var(--slate);font-size:14px;margin:8px 0 0}
  .meta{
    display:flex;gap:14px;margin:18px 0 4px;flex-wrap:wrap;
    font-family:var(--mono);font-size:12.5px;color:var(--slate);
  }
  .meta b{color:var(--pine);font-weight:600}
  .rule{height:1px;background:var(--line-soft);margin:18px 0}
  ol.how{margin:6px 0 0;padding-left:20px;color:var(--ink);font-size:15px}
  ol.how li{margin:7px 0}
  .note{
    background:var(--gold-soft);border-radius:10px;padding:11px 13px;
    font-size:13.5px;color:#6b5417;margin-top:16px;
  }
  /* chips */
  .counter{
    font-family:var(--mono);font-size:13px;color:var(--slate);
    display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 12px;
  }
  .counter b{color:var(--pine);font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    font-family:var(--sans);font-size:14.5px;font-weight:500;
    padding:9px 13px;border-radius:99px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;user-select:none;
    transition:transform .08s,background .15s,border-color .15s,color .15s;
    min-height:40px;
  }
  .chip:active{transform:scale(.96)}
  .chip.sel{background:var(--pine);border-color:var(--pine);color:#fff}
  .chip.dim{opacity:.45}
  .chip.final{background:var(--gold);border-color:var(--gold);color:#3a2c08}
  .addrow{display:flex;gap:8px;margin-top:14px}
  input[type=text],textarea{
    width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;resize:vertical;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px rgba(44,95,90,.14)}
  textarea{min-height:74px;line-height:1.45}
  .btn-add{
    flex:0 0 auto;padding:0 16px;border-radius:10px;border:1px solid var(--pine);
    background:#fff;color:var(--pine);font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;
  }
  /* value operationalize */
  .vblock{border:1px solid var(--line-soft);border-radius:12px;padding:14px;margin-top:12px;background:#fff}
  .vblock .vname{font-family:var(--mono);font-weight:600;color:var(--gold);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  label.q{display:block;font-size:14.5px;font-weight:600;margin:16px 0 7px}
  label.q:first-child{margin-top:0}
  /* nav */
  .nav{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(to top,var(--paper) 68%,rgba(241,244,239,0));
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .nav-inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{
    font-family:var(--sans);font-size:16px;font-weight:600;
    border-radius:12px;padding:14px 18px;cursor:pointer;border:1px solid transparent;
    transition:transform .08s,opacity .15s;min-height:50px;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{flex:1;background:var(--pine);color:#fff}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:#fff;color:var(--pine);border-color:var(--line)}
  /* summary */
  .sum-item{padding:14px 0;border-bottom:1px solid var(--line-soft)}
  .sum-item:last-child{border-bottom:none}
  .sum-k{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);margin-bottom:4px}
  .sum-v{font-size:15.5px;white-space:pre-wrap}
  .sum-v em{color:var(--slate);font-style:normal}
  .pill{display:inline-block;background:var(--gold-soft);color:#6b5417;font-family:var(--mono);font-size:13px;font-weight:600;padding:4px 11px;border-radius:99px;margin:0 6px 6px 0}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:96px;
    background:var(--ink);color:#fff;font-size:14px;padding:10px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="dots" id="dots"></div>
    <div class="eyebrow" id="stepcount"></div>
  </div>
  <div id="view"></div>
</div>

<div class="nav" id="nav" style="display:none">
  <div class="nav-inner">
    <button class="btn btn-ghost" id="back" style="display:none">Back</button>
    <button class="btn btn-primary" id="next">Next</button>
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script>
const STEPS = ["intro","values","narrow","year","summary"];
let step = 0;

const state = {
  shortlist: [],      // values circled
  core: [],           // final 2
  vlines: {},         // value -> "what it looks like"
  goalMe:"", goalLab:""
};

const VALUES = [
  "Accountability","Achievement","Adaptability","Adventure","Ambition","Authenticity",
  "Balance","Belonging","Career","Caring","Collaboration","Commitment","Community",
  "Compassion","Competence","Confidence","Connection","Contribution","Cooperation",
  "Courage","Creativity","Curiosity","Dignity","Diversity","Efficiency","Equality",
  "Ethics","Excellence","Fairness","Faith","Family","Freedom","Friendship","Fun",
  "Generosity","Grace","Gratitude","Growth","Harmony","Health","Honesty","Hope",
  "Humility","Humor","Inclusion","Independence","Initiative","Integrity","Intuition",
  "Joy","Justice","Kindness","Knowledge","Leadership","Learning","Legacy","Love",
  "Loyalty","Openness","Optimism","Order","Patience","Peace","Perseverance","Power",
  "Pride","Recognition","Reliability","Resourcefulness","Respect","Responsibility",
  "Risk-taking","Security","Self-discipline","Self-respect","Service","Simplicity",
  "Spirituality","Stewardship","Success","Teamwork","Trust","Truth","Understanding",
  "Uniqueness","Vision","Vulnerability","Well-being","Wisdom"
];

const view = document.getElementById("view");
const dots = document.getElementById("dots");
const stepcount = document.getElementById("stepcount");
const nav = document.getElementById("nav");
const backBtn = document.getElementById("back");
const nextBtn = document.getElementById("next");
const toast = document.getElementById("toast");

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  dots.innerHTML = STEPS.map((_,i)=>`<span class="dot ${i<step?'done':''} ${i===step?'on':''}"></span>`).join("");
  stepcount.textContent = `${step+1} / ${STEPS.length}`;
  const name = STEPS[step];
  nav.style.display = name==="intro" ? "none" : "block";
  backBtn.style.display = (step>0 && name!=="intro") ? "block" : "none";
  ({intro:rIntro,values:rValues,narrow:rNarrow,year:rYear,summary:rSummary}[name])();
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- INTRO ---------- */
function rIntro(){
  view.innerHTML = `
  <div class="card">
    <div class="step-label">CoCoA Lab · 2026 retreat</div>
    <h1>Individual Values Reflection</h1>
    <p class="lede">Work through this on your own. Nothing is sent anywhere — at the end you'll get a clean summary to copy and share when we go around the room.</p>
    <div class="meta"><span><b>~10 min</b> solo</span><span><b>Private</b> on your phone</span><span><b>Copy</b> at the end</span></div>
    <div class="rule"></div>
    <div class="step-label" style="color:var(--pine)">What you'll do</div>
    <ol class="how">
      <li>Pick the values that ring true — then narrow to your <b>two</b> core ones.</li>
      <li>Look ahead: one goal for you, one you'd propose for the lab.</li>
    </ol>
    <div class="note">Heads up: answers live only on this screen and clear if you refresh. That's on purpose — you keep them by copying at the end.</div>
    <button class="btn btn-primary" style="width:100%;margin-top:20px" onclick="go(1)">Start</button>
  </div>`;
}

/* ---------- VALUES (circle all) ---------- */
function rValues(){
  view.innerHTML = `
  <div class="card">
    <div class="step-label">Step 1 · Circle what resonates</div>
    <h2>Which of these feel true to who you are?</h2>
    <p class="hint">Tap every one that fits — don't overthink it. Aim for a loose handful, not a philosophy.</p>
    <div class="counter"><span>Selected</span><b id="vcount">${state.shortlist.length}</b></div>
    <div class="chips" id="vchips"></div>
    <div class="addrow">
      <input type="text" id="vadd" placeholder="Add your own…" autocomplete="off"
        onkeydown="if(event.key==='Enter'){addVal();event.preventDefault();}">
      <button class="btn-add" onclick="addVal()">Add</button>
    </div>
  </div>`;
  paintChips();
  nextBtn.textContent = "Next";
  nextBtn.disabled = state.shortlist.length < 2;
  nextBtn.onclick = ()=>go(2);
  backBtn.onclick = ()=>go(0);
}
function paintChips(){
  const all = [...VALUES];
  state.shortlist.forEach(v=>{ if(!all.includes(v)) all.push(v); });
  document.getElementById("vchips").innerHTML = all.map(v=>{
    const sel = state.shortlist.includes(v);
    return `<span class="chip ${sel?'sel':''}" onclick="toggleVal('${v.replace(/'/g,"\\'")}')">${esc(v)}</span>`;
  }).join("");
  document.getElementById("vcount").textContent = state.shortlist.length;
  nextBtn.disabled = state.shortlist.length < 2;
}
function toggleVal(v){
  const i = state.shortlist.indexOf(v);
  if(i>=0) state.shortlist.splice(i,1); else state.shortlist.push(v);
  // keep core valid
  state.core = state.core.filter(c=>state.shortlist.includes(c));
  paintChips();
}
function addVal(){
  const el = document.getElementById("vadd");
  const v = el.value.trim();
  if(v && !state.shortlist.includes(v)) state.shortlist.push(v);
  el.value="";
  paintChips();
}

/* ---------- NARROW to 2 ---------- */
function rNarrow(){
  view.innerHTML = `
  <div class="card">
    <div class="step-label">Step 1 · Narrow to two</div>
    <h2>Now the hard part: pick just two.</h2>
    <p class="hint">Not your top ten — your <b>two</b>. The idea (from Dare to Lead): if everything's a value, nothing is. Which two do you actually decide from when things get hard?</p>
    <div class="counter"><span>Choose exactly 2</span><b><span id="ccount">${state.core.length}</span>/2</b></div>
    <div class="chips" id="cchips"></div>
    <div id="vlines"></div>
  </div>`;
  paintCore();
  backBtn.onclick = ()=>go(1);
}
function paintCore(){
  const atMax = state.core.length>=2;
  document.getElementById("cchips").innerHTML = state.shortlist.map(v=>{
    const sel = state.core.includes(v);
    const cls = sel ? "final" : (atMax ? "dim" : "");
    return `<span class="chip ${cls}" onclick="toggleCore('${v.replace(/'/g,"\\'")}')">${esc(v)}</span>`;
  }).join("");
  document.getElementById("ccount").textContent = state.core.length;

  // optional one-liners for chosen values
  const wrap = document.getElementById("vlines");
  wrap.innerHTML = state.core.map(v=>`
    <div class="vblock">
      <div class="vname">${esc(v)}</div>
      <label class="q">What does living this out look like for me? <span style="color:var(--slate);font-weight:400">(optional)</span></label>
      <input type="text" value="${esc(state.vlines[v]||'')}"
        placeholder="e.g. I say the hard thing kindly, even when it's easier not to"
        oninput="state.vlines['${v.replace(/'/g,"\\'")}']=this.value">
    </div>`).join("");

  nextBtn.textContent = "Next";
  nextBtn.disabled = state.core.length!==2;
  nextBtn.onclick = ()=>go(3);
}
function toggleCore(v){
  const i = state.core.indexOf(v);
  if(i>=0){ state.core.splice(i,1); }
  else if(state.core.length<2){ state.core.push(v); }
  paintCore();
}

/* ---------- YEAR AHEAD ---------- */
function rYear(){
  view.innerHTML = `
  <div class="card">
    <div class="step-label">Step 2 · Look ahead</div>
    <h2>The year in front of us.</h2>
    <label class="q">My #1 goal this year</label>
    <textarea oninput="state.goalMe=this.value" placeholder="A paper, a skill, a fellowship, a habit — whatever matters most to you">${esc(state.goalMe)}</textarea>
    <label class="q">One goal I'd propose for the lab</label>
    <textarea oninput="state.goalLab=this.value" placeholder="Something we should aim for, start, or fix as a group">${esc(state.goalLab)}</textarea>
    <div class="note">In the room, the facilitator will collect everyone's lab goals — this is where the shared plan comes from.</div>
  </div>`;
  nextBtn.textContent = "See my summary";
  nextBtn.disabled = false;
  nextBtn.onclick = ()=>go(4);
  backBtn.onclick = ()=>go(2);
}

/* ---------- SUMMARY ---------- */
function rSummary(){
  const v = state.core.map(c=>{
    const line = state.vlines[c] ? ` — <em>${esc(state.vlines[c])}</em>` : "";
    return `<span class="pill">${esc(c)}</span>`;
  }).join("");
  const vdetail = state.core.filter(c=>state.vlines[c]).map(c=>
    `<div class="sum-v" style="margin-top:6px"><b>${esc(c)}:</b> <em>${esc(state.vlines[c])}</em></div>`).join("");
  view.innerHTML = `
  <div class="card">
    <div class="step-label">Yours to keep</div>
    <h2>Here's your reflection.</h2>
    <p class="hint">Tap copy, then paste it into our lab chat / doc — or just read from it when we go around.</p>
    <div class="sum-item">
      <div class="sum-k">My two core values</div>
      <div class="sum-v">${v || '<em>none chosen</em>'}</div>
      ${vdetail}
    </div>
    <div class="sum-item"><div class="sum-k">My goal this year</div><div class="sum-v">${esc(state.goalMe)||'<em>—</em>'}</div></div>
    <div class="sum-item"><div class="sum-k">Goal I'd propose for the lab</div><div class="sum-v">${esc(state.goalLab)||'<em>—</em>'}</div></div>
  </div>`;
  nextBtn.textContent = "Copy my answers";
  nextBtn.disabled = false;
  nextBtn.onclick = copyAll;
  backBtn.onclick = ()=>go(3);
}

function plainText(){
  const L=[];
  L.push("MY REFLECTION — CoCoA LAB 2026 RETREAT");
  L.push("");
  L.push("Core values: "+(state.core.join("  •  ")||"—"));
  state.core.forEach(c=>{ if(state.vlines[c]) L.push("  · "+c+": "+state.vlines[c]); });
  L.push("");
  L.push("My goal this year: "+(state.goalMe||"—"));
  L.push("Goal I'd propose for the lab: "+(state.goalLab||"—"));
  return L.join("\n");
}
function copyAll(){
  const text = plainText();
  const done=()=>showToast();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text,cb){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); cb&&cb();
}
let toastT;
function showToast(){
  toast.classList.add("show");
  clearTimeout(toastT);
  toastT=setTimeout(()=>toast.classList.remove("show"),1800);
}

function go(i){ step=i; render(); }
render();
</script>
</body>
</html>
